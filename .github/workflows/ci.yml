name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.php }}/${{ matrix.laravel }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['^12.0', '^13.0']
        include:
          - php: '8.4'
            laravel: '^13.0'
            stability: high

    env:
      LARAVEL_DEPENDENCY_VERSION: ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcov, sqlite3
          coverage: pcov

      - name: Install dependencies
        run: |
          composer config minimum-stability ${{ matrix.stability || 'stable' }}
          composer config prefer-stable true
          composer require "illuminate/contracts:${LARAVEL_DEPENDENCY_VERSION}" "illuminate/http:${LARAVEL_DEPENDENCY_VERSION}" "illuminate/support:${LARAVEL_DEPENDENCY_VERSION}" "laravel/doctor:${LARAVEL_DEPENDENCY_VERSION}" --no-interaction --no-progress --no-update
          composer install --no-interaction --no-progress

      - name: Run tests
        run: composer test -- --compact

      - name: Run linting
        run: composer lint

      - name: Run static analysis
        run: composer analyse
